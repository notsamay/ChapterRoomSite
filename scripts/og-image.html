<!doctype html>
<!--
  Source for public/og.png. Regenerate after editing:

    "C:/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --disable-gpu \
      --force-device-scale-factor=1 --virtual-time-budget=8000 --window-size=1200,630 \
      --screenshot=public/og.png scripts/og-image.html

  Kept as HTML rather than a generated ImageResponse so the card uses the same faces as
  the site and needs no network access at build time.
-->
<meta charset="utf-8">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    background: radial-gradient(120% 95% at 50% -10%, #1B5340 0%, #123A2E 55%, #0B241C 100%);
    color: #F6F2E9;
    font-family: 'General Sans', system-ui, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { height: 46px; width: auto; display: block; }
  .brand span { font-size: 26px; font-weight: 600; letter-spacing: -0.015em; }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 108px;
    line-height: 0.88;
    letter-spacing: -0.055em;
    max-width: 15ch;
  }
  p { margin-top: 26px; max-width: 780px; font-size: 25px; line-height: 1.45; color: rgba(246,242,233,0.7); }
  .meta { display: flex; gap: 14px; }
  .meta span {
    border: 1px solid rgba(246,242,233,0.28);
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 18px;
    font-weight: 500;
    color: rgba(246,242,233,0.8);
  }
</style>
<div class="brand">
  <img src="../public/logo-mark.png" alt="">
  <span>Chapter Room</span>
</div>
<div>
  <h1>Run your chapter from your pocket.</h1>
  <p>Attendance, dues, announcements, chats, albums and vouchers &mdash; everything your chapter runs on, in one app.</p>
</div>
<div class="meta">
  <span>Launching spring 2027</span>
  <span>iOS and Android</span>
</div>
